name: Repo Knowledge Sync

# Rollout of soobujmiah/skb's governance/DETERMINISTIC_STATE_SYNC_POLICY.md to this repository
# (DEC-2026-09-25-002). tools/repo_knowledge/ and schemas/*.schema.json are vendored copies from
# soobujmiah/skb -- see tools/repo_knowledge/README.md. Do not hand-edit .repo/; it is
# regenerated by this workflow.
#
# Two jobs, matching the pattern established on skb/ggen (cheap, side-effect-free CI is
# re-run directly here; unlike lai's expensive native build, there's no reason to consume an
# existing run via workflow_run instead):
#   - test: runs tools/repo_knowledge's own unit tests (guards the vendored copy). Allowed to fail.
#   - sync: ALWAYS runs (even if `test` failed, or `flutter analyze`/`flutter test` fail -- policy
#     rule 4/7: a failed check must still be recorded, not silently dropped). Does not build or
#     upload the debug APK -- that's flutter-ci.yml's job, not a routine status signal.

on:
  push:
    branches: [main]
    paths-ignore:
      - '.repo/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.1'
  FLUTTER_CHANNEL: stable

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Run tools/repo_knowledge tests
        run: python3 -m unittest discover -s tools/repo_knowledge/tests -p 'test_*.py' -v

  sync:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python dependencies
        run: pip install --quiet pyyaml

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: flutter analyze (build signal)
        id: build
        continue-on-error: true
        working-directory: apps/android
        run: |
          flutter pub get
          flutter analyze

      - name: flutter test (test signal)
        id: test_step
        continue-on-error: true
        working-directory: apps/android
        run: flutter test

      - name: Run tools/repo_knowledge tests (guard the vendored copy)
        run: python3 -m unittest discover -s tools/repo_knowledge/tests -p 'test_*.py'

      - name: Collect and sync deterministic state
        if: always()
        run: |
          build_status="${{ steps.build.outcome == 'success' && 'passed' || 'failed' }}"
          test_status="${{ steps.test_step.outcome == 'success' && 'passed' || 'failed' }}"
          python3 -m tools.repo_knowledge sync --ci \
            --build-status "$build_status" --build-run-id "${{ github.run_id }}" \
            --test-status "$test_status" --test-summary "flutter test (apps/android)"

      - name: Verify .repo/ against schemas
        if: always()
        run: python3 -m tools.repo_knowledge verify

      - name: Commit updated .repo/ state
        if: always() && github.event_name == 'push'
        run: |
          set -euo pipefail
          if git diff --quiet -- .repo; then
            echo "no .repo/ change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .repo
          git commit -m "chore(repo-knowledge): sync deterministic state for ${{ github.sha }}"
          git push origin HEAD:${{ github.ref_name }}
